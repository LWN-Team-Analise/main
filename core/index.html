<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` e o que faz a pagina ir ate as bordas do
         iPhone. Sem ele o `env(safe-area-inset-*)` volta zero, e a ilha
         do aviso nao tem como se encostar embaixo da Dynamic Island. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04122c" />

    <!-- Instalado na tela de inicio, abre como aplicativo: sem barra de
         endereco, com o nome e o icone da empresa. -->
    <link rel="manifest" href="/core/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atmosfera LWN" />
    <!-- `black-translucent`: a tela sobe por BAIXO da barra de status,
         que e o que permite ao aviso encostar na altura da ilha. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Atmosfera LWN</title>
    <!-- O icone da aba e o MESMO do site da LWN (public/assets): o sistema
         mora dentro do site, e as duas abas mostram a mesma marca. -->
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <!-- O icone do app no celular e o mesmo desenho do favicon, em fundo
         branco (o iPhone pinta de preto o que e transparente). Os nomes
         sao novos de proposito: o celular que guardou o icone antigo
         busca este como se fosse outro. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/core/icone-app-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/core/src/main.jsx"></script>
  </body>
</html>
