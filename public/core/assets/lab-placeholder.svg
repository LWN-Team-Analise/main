<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12305f" />
      <stop offset="45%" stop-color="#0a1e42" />
      <stop offset="100%" stop-color="#050f26" />
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="#7fc4ff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7fc4ff" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)" />
  <rect width="1200" height="1500" fill="url(#light)" />

  <g filter="url(#soft)" fill="#bcdcff" opacity="0.14">
    <rect x="120" y="820" width="120" height="360" rx="60" />
    <rect x="300" y="700" width="90" height="480" rx="45" />
    <path d="M470 760 h190 l-60 200 v220 h-70 V960 Z" />
    <circle cx="880" cy="640" r="150" />
    <rect x="820" y="900" width="220" height="280" rx="40" />
  </g>

  <g stroke="#cfe6ff" stroke-opacity="0.16" stroke-width="2" fill="none">
    <line x1="0" y1="1180" x2="1200" y2="1180" />
    <line x1="0" y1="430" x2="1200" y2="430" />
  </g>

  <text
    x="600"
    y="1420"
    text-anchor="middle"
    font-family="Inter, system-ui, sans-serif"
    font-size="26"
    letter-spacing="4"
    fill="#cfe6ff"
    fill-opacity="0.4"
  >
    public/assets/lab.jpg
  </text>
</svg>
