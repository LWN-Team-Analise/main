<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LWN Engenharia — Qualificação e Certificação de Salas Limpas</title>
    <meta
      name="description"
      content="A LWN Engenharia é especialista em qualificação e certificação de salas limpas, Smoke Test, Gases Medicinais e Sistemas HVAC-R, garantindo qualidade, segurança e conformidade com as normas mais rigorosas."
    />
    <meta name="theme-color" content="#081430" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LWN Engenharia" />
    <meta
      property="og:description"
      content="Referência Nacional em Qualificação e Certificação de Salas Limpas e Gases Industriais."
    />
    <meta property="og:image" content="/assets/hero/hero-video-poster.webp" />

    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/app-icon-192.png" />

    <!-- The hero video's first frame (wide screens only: phones get no video). -->
    <link
      rel="preload"
      as="image"
      href="/assets/hero/hero-video-poster.webp"
      type="image/webp"
      media="(min-width: 900px)"
      fetchpriority="high"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <script>
      try {
        if (localStorage.getItem('lwn-color-scheme') === 'dark') document.documentElement.dataset.scheme = 'dark';
        if (localStorage.getItem('lwn-language') === 'en') {
          document.documentElement.dataset.lang = 'en';
          document.documentElement.lang = 'en';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
